{% load i18n %}
<div class="row my-1">
<div class="col-12">

{% if not wizard.steps.auth %}
    <button type="submit" class="btn btn-primary">{% translate "Fortsæt" %}</button>
{% else %}
    <button type="submit" class="btn btn-primary d-flex align-items-center">
        <i class="ph ph-sign-in"></i>
        <span class="text-nowrap ms-1">{% translate 'Log ind' %}</span>
    </button>
{% endif %}
</div>
</div>
