{% extends "card.html" %}
{% load i18n %}

{% block title %}
{% translate "Log ind" %}
{% endblock %}

{% block card_content %}

<form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary d-flex align-items-center">
        <i class="ph ph-sign-in"></i>
        <span class="text-nowrap ms-1">{% translate 'Log ind' %}</span>
    </button>
</form>
{% endblock %}
