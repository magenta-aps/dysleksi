{% extends 'dysleksi/screening/individual/base.html' %}

{% block content %}
<div class="container" data-test-type="{{ test_type }}" data-role="teacher" data-room-name="{{ room_name }}">
    <button class="btn btn-success d-none" id="correct">Korrekt</button>
    <button class="btn btn-danger d-none" id="wrong">Forkert</button>
    <button class="btn btn-outline-primary d-none" id="skipped">Sprunget over</button>
    <table id="events" class="table">
        <thead>
            <tr>
                <th>Begivenhed</th>
                <th>Spørgsmål</th>
                <th>Svar</th>
                <th>Tid</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>
{% endblock %}
