{% extends 'dysleksi/screening/individual/base.html' %}

{% block css %}
<style>
    div#choices {
        display: flex;
        width: 50%;
        padding: 0;
        justify-content: space-between;
        list-style: none inside none;
    }
    div#choices button {
        padding: 1rem 3rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
    }
 </style>
{% endblock %}

{% block content %}
<div class="container" data-role="student" data-room-name="{{ room_name }}">
    <h1 id="question"></h1>
    <div id="choices"></div>
    <p id="choice"></p>
</div>
{% endblock %}
