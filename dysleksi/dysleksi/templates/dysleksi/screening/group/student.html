{% extends 'dysleksi/screening/group/base.html' %}

{{ test_contents|json_script:"test_contents" }}

{% block js %}
{{ block.super }}
<script>
    // Flatten all questions into a single "tests" array
    const tests = [];
    for (const part of test_contents.parts) {
        for (const question of part.questions) {
            tests.push({
                partId: part.id,
                partName: part.name,
                questionId: question.id,
                challengeName: question.challenge_name,
                challengeImageUrl: question.challenge_image_url,
                challengeSoundUrl: question.challenge_sound_url,
                choices: question.possible_answers.map(a => ({
                    id: a.id,
                    text: a.resource_text,
                    isCorrect: a.is_correct
                }))
            });
        }
    }

    let testIndex = 0;
    let displayedAt = 0;
    let selectedChoice = null;

    const updateTest = function () {
        const test = tests[testIndex];
        displayedAt = document.timeline.currentTime;
        selectedChoice = null;

        const questionEl = document.querySelector('h1#question');
        const choicesEl = document.querySelector('div#choices');
        const nextBtn = document.querySelector('button#next');

        questionEl.innerHTML = `${testIndex + 1}/${tests.length} (${test.partName})`;

        choicesEl.innerHTML = '';
        nextBtn.style.display = 'none'; // hide Next until answer selected

        for (const choice of test.choices) {
            const choiceEl = document.createElement('button');
            choiceEl.innerHTML = choice.text;
            choiceEl.classList.add('btn', 'btn-outline-primary');
            choicesEl.append(choiceEl);
            choiceEl.addEventListener('click', function (e) {
                selectChoice(e);
            });
        }

        // Display image if present
        if (test.challengeImageUrl) {
            let imgEl = document.querySelector('#challenge-image');
            if (!imgEl) {
                imgEl = document.createElement('img');
                imgEl.id = 'challenge-image';
                imgEl.style.maxWidth = '300px';
                imgEl.style.display = 'block';
                imgEl.style.margin = '1rem 0';
                questionEl.after(imgEl);
            }
            imgEl.src = test.challengeImageUrl;
        }
    }

    const selectChoice = function (e) {
        const choiceEl = e.target;
        selectedChoice = choiceEl.innerHTML;

        // Highlight only the selected choice, allow changing
        const choicesEls = document.querySelectorAll('div#choices button');
        choicesEls.forEach(el => {
            if (el === choiceEl) {
                el.classList.replace('btn-outline-primary', 'btn-primary');
            } else {
                el.classList.replace('btn-primary', 'btn-outline-primary');
            }
        });

        // Show Next button
        document.querySelector('button#next').style.display = 'inline-block';
    };

    const nextQuestion = function() {
        if (!selectedChoice) {
            alert("Vælg et svar, før du går videre.");
            return;
        }

        const answeredAt = document.timeline.currentTime;
        const duration = ((answeredAt - displayedAt)/1000).toFixed(1); // seconds

        // Send message to teacher when "Next" is clicked
        chatSocket.send(JSON.stringify({
            event: 'test.answered',
            id: '{{ room_name }}',
            message: `Elev {{ user.get_full_name }} har gennemført spørgsmål ${testIndex + 1}`,
            choice: selectedChoice,
            index: testIndex,
            displayedAt: displayedAt,
            answeredAt: answeredAt,
            duration: duration,
        }));

        if (testIndex < tests.length - 1) {
            testIndex++;
            updateTest();
        } else {
            alert("Testen er færdig!");
            chatSocket.send(JSON.stringify({
                event: 'test.completed',
                id: '{{ room_name }}',
                message: 'Testen er afsluttet for {{ user.get_full_name }}.'
            }));
        }
    };

    document.addEventListener('DOMContentLoaded', function () {
        const nextBtn = document.querySelector('button#next');
        nextBtn.addEventListener('click', nextQuestion);

        chatSocket.addEventListener('open', function () {
            updateTest();
        });
    });
</script>
{% endblock %}

{% block css %}
<style>
div#choices {
    display: flex;
    width: 50%;
    padding: 0;
    justify-content: space-between;
    list-style: none inside none;
}
div#choices button {
    padding: 1rem 3rem;
    border: 1px solid #ccc;
    border-radius: 0.5rem;
}
button#next {
    margin-top: 1rem;
    padding: 0.75rem 2rem;
    display: none; /* hidden until answer selected */
}
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h1 id="question"></h1>
    <div id="choices"></div>
    <button id="next" class="btn btn-success">Næste</button>
</div>
{% endblock %}
