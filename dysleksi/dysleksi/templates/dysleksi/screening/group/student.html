{% extends 'dysleksi/screening/group/base.html' %}

{% block content %}
<div class="container" data-test-type="group" data-role="student" data-room-name="{{ room_name }}" data-assignment-id="{{ object.pk }}">

    <h1 id="instructions-text"></h1>
    <audio id="instructions-sound"></audio>
    <button class="btn btn-primary" id="start-practice">Start øveopgaver</button>
    <button class="btn btn-primary" id="start-questions">Start rigtige opgaver</button>

    <h1 id="question-title"></h1>
    <div id="question-challenge"></div>
    <div id="choices"></div>
    <button id="next" class="btn next-btn">
        <span class="material-icons">arrow_forward</span>
    </button>
</div>
{% endblock %}
