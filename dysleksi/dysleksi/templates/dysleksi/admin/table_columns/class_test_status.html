{% with record.test_status|label_from_choices:ClassTestStatus as test_status %}
    {% if record.test_status == ClassTestStatus.OPEN %}
    <span class="d-flex align-items-center">
        <span class="d-flex align-items-center"><i class="ph ph-lock-simple-open fs-5 me-1"></i></span>
        {{ test_status }}
    </span>
{% elif record.test_status == ClassTestStatus.LOCKED %}
    <span class="d-flex align-items-center">
        <span class="d-flex align-items-center text-success"><i class="ph ph-lock-simple fs-5 me-1"></i></span>
        {{ test_status }}
    </span>
{% else %}
    -
{% endif %}
{% endwith %}
