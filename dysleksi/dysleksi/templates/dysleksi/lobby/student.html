{% extends "dysleksi/lobby/base.html" %}
{% load i18n %}

{% block content %}
<div
    class="container"
    data-lobby-role="student"
    data-individual-room-name="student_{{ student.id }}"
    data-class-room-name="class_{{ student.class.id }}"
    data-individual-room-url="{% url 'dysleksi:room' room_name='student_'|add:student.id %}"
    data-class-room-url="{% url 'dysleksi:room' room_name='class_'|add:student.class.id %}"
>
    <h1>{% translate "Elev" %}</h1>
    <p>
        {% blocktrans trimmed with name=student.name %}
        Velkommen {{ name }}
        {% endblocktrans %}
    </p>
    <p>{% translate "Venter på at testen begynder ..." %}</p>
</div>
{% endblock %}
