repos:
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies:
        - flake8-absolute-import
        args:
        - "--max-line-length=88"
        - "--exclude=**/migrations/*.py,settings.py"
        - "--extend-ignore=E226,E203"

  - repo: https://github.com/psf/black
    rev: 24.4.1
    hooks:
      - id: black
        exclude: migrations

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        exclude: migrations
        args: ["--profile", "black"]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.24.0
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [ pre-push ]

  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.42.0
    hooks:
      - id: oxfmt
        files: ^dysleksi/dysleksi/static/js/.*\.js$
        additional_dependencies:
          - "oxfmt@0.42.0"
          - "@oxfmt/binding-linux-x64-gnu@0.42.0"

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.57.0
    hooks:
      - id: oxlint
        verbose: true
        additional_dependencies:
          - "oxlint@1.57.0"
          - "@oxlint/binding-linux-x64-gnu@1.57.0"
