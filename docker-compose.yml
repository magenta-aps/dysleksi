services:

  # Use traefik with a self-signed certificate to serve on HTTPS, as audio recording
  # in a browser context requires HTTPS connections in any case.
  dysleksi-traefik:
    image: traefik:v3.6
    container_name: dysleksi-traefik
    ports:
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    environment:
      - HOSTNAME=dysleksi-web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dev-environment/cert:/ssl:ro
      - ./dev-environment/traefik_static.yaml:/etc/traefik/traefik.yaml:ro
      - ./dev-environment/traefik_dynamic/:/etc/traefik/dynamic/:ro
    networks:
      - default
      - database

  dysleksi-web:
    user: "75200:1000"  # Override in docker-compose.override.yml if your local user is different
    container_name: dysleksi-web
    image: dysleksi:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - ./dev-environment/dysleksi.env
    volumes:
      - ./dysleksi/:/app:rw
      - ./log/dysleksi.log:/log/dysleksi.log:rw
      - ./dev-environment/cert:/ssl:ro
      - ./data:/data:ro
      - ./mypy.ini:/mypy.ini:ro
      #- ./file-data:/upload:rw
      - ./instructions:/upload/instructions/:ro
      - ../dysleksi-binaries/:/upload/dev-data/:ro
      - idp-data:/app/idp:rw
      # Note: Use /static/ instead of /static-copy/ to allow hot-reloading
      # In a production environment we would use /static-copy/
      - staticfiles-data:/static/
      - mediafiles-data:/upload/
    environment:
      - PULL_IDP_METADATA=true
      - MAKE_MIGRATIONS=true
      - MIGRATE=true
      - MAKEMESSAGES=true
      - CREATE_DUMMY_USERS=true
      - CREATE_DUMMY_DATA=true
      - TEST=true
      - DUMMY_DATA_DIR=/upload/dev-data/dummy-data
      - REAL_DATA_DIR=/upload/dev-data/real-data
      - ECHO_INTERFACE=https://dysleksi-web
      - STATICFILES_DESTINATION_DIR=/static-copy
    networks:
      - default
      - database
    depends_on:
      - dysleksi-db
    # We use `uvicorn` (and not stock `gunicorn`) as the websocket features
    # rely on `uvicorn` and `django-channels`.
    # In local dev env, run `uvicorn` binary directly, as it supports using the
    # `--reload` option for live code reload during development.
    command: uvicorn project.asgi:application --host 0.0.0.0 --port 8000 --reload

  dysleksi-db:
    # Do not set `user` here
    container_name: dysleksi-db
    image: postgres:18
    env_file:
      - ./dev-environment/dysleksi.env
    volumes:
      - postgres-data:/var/lib/postgresql/18/data
    networks:
      - database

  dysleksi-redis:
    container_name: dysleksi-redis
    image: redis:8
    networks:
      - database

  dysleksi-idp:
    user: "1000:1000"  # Override in docker-compose.override.yml if your local user is different
    image: kenchan0130/simplesamlphp
    container_name: dysleksi-idp
    environment:
      HTTP_PORT: 8142
      SIMPLESAMLPHP_SP_ENTITY_ID: https://dysleksi-web:8140/mitid/saml/metadata/
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: https://dysleksi-web/mitid/login/callback/
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: https://dysleksi-web/mitid/logout/callback/
      SIMPLESAMLPHP_IDP_CERTIFICATE: /var/www/simplesamlphp/cert/selfsigned.crt
      SIMPLESAMLPHP_IDP_PRIVATEKEY: /var/www/simplesamlphp/cert/selfsigned.key
    volumes:
      - ./dev-environment/cert/idp/selfsigned.crt:/var/www/simplesamlphp/cert/server.crt:ro
      - ./dev-environment/cert/idp/selfsigned.key:/var/www/simplesamlphp/cert/server.pem:ro
      - ./dev-environment/idp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro
      - ./dev-environment/idp/saml20-sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php:ro
      - ./dev-environment/idp/ports.conf:/etc/apache2/ports.conf:ro
      - ./dev-environment/idp/site.conf:/etc/apache2/sites-available/simplesamlphp.conf:ro
    ports:
      - "8142:8142"
    networks:
      - default

  dysleksi-hosts-updater:
    container_name: dysleksi-hosts-updater
    image: bash
    volumes:
      - ./dev-environment/hosts.sh:/hosts.sh:ro
      - /etc/hosts:/hosts:rw
    command: [ "bash", "/hosts.sh" ]

  dysleksi-js-tests:
    container_name: dysleksi-js-tests
    image: node:25
    working_dir: /app
    volumes:
      - ./dysleksi/dysleksi/static/js:/app/src:ro
      - ./dysleksi/package.json:/app/package.json:ro
      - ./dysleksi/package-lock.json:/app/package-lock.json:ro
      - vitest-coverage:/app/coverage
    command: >
      sh -c "
        npm ci &&
        npx vitest run --coverage --coverage.provider=istanbul --coverage.include='/app/src/**/*.js' --coverage.exclude='/app/src/__tests__/**/*.js' --coverage.reportsDirectory=/app/coverage/vitest_coverage --silent passed-only
      "
    networks:
      - default

  dysleksi-js-coverage:
    # Coverage is available to browse at http://localhost:8143/vitest_coverage/
    container_name: dysleksi-js-coverage
    image: nginx:alpine
    volumes:
      - vitest-coverage:/usr/share/nginx/html:ro
    ports:
      - "8143:80"
    networks:
      - default

  peerjs-server:
    image: peerjs/peerjs-server
    container_name: peerjs-server
    command: [
      "--port", "9000",
      "--path", "/webrtc",
      "--key", "dysleksi_dev",
    ]
    networks:
      - default

  lobby-bots:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    container_name: lobby-bots
    volumes:
      - ./playwright/lobby_mock.js:/app/lobby_mock.js:ro
      - lobby-bots-modules:/app/node_modules
    working_dir: /app
    links:
      - dysleksi-traefik:dysleksi-web
    command: >
      sh -c "
        npm install playwright@1.59.1 &&
        echo 'Waiting for dysleksi-web to be healthy (no 502)...' &&
        until curl -k -s -f https://dysleksi-web/login?next=/ > /dev/null; do
          sleep 2
        done &&
        echo 'dysleksi-web is healthy! Starting bots...' &&
        node lobby_mock.js
      "
    networks:
      - default

  dysleksi-media-web:
    container_name: dysleksi-media-web
    image: halverneus/static-file-server:latest
    environment:
      - URL_PREFIX=/media
    volumes:
      - mediafiles-data:/web:ro
    networks:
      - default
    restart: unless-stopped

  dysleksi-static-web:
    container_name: dysleksi-static-web
    image: halverneus/static-file-server:latest
    environment:
      - URL_PREFIX=/static
    volumes:
      - staticfiles-data:/web:ro
    networks:
      - default
    restart: unless-stopped


volumes:
  postgres-data:
  file-data:
  idp-data:
  staticfiles-data:
  mediafiles-data:
  vitest-coverage:
  lobby-bots-modules:

networks:
  default:
  database:
