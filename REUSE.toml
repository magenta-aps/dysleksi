version = 1
SPDX-PackageName = "Dysleksi"
SPDX-PackageSupplier = "Magenta ApS <info@magenta.dk>"

[[annotations]]
path = [
    "dysleksi/**",
    "dev-environment/**",
    "data/tabulex/selfsigned*",
    "data/tabulex/inst.json",
    "docker/**",
    "docker-compose.yml",
    "docker-compose.override.template.yml",
    ".eslint/**",
    ".coveragerc",
    ".oxfmtrc.json",
    ".oxlintrc.json",
    ".gitlab-ci.yml",
    "mypy.ini",
    "requirements.txt",
    ".coveragerc",
    "REUSE.toml",
    "README.md",
    ".renovaterc",
    "dev-idp/**",
    "rfc/**",
    "file-data/**",
    "instructions/**",
    "js_coverage/**",
    "playwright/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Magenta ApS <info@magenta.dk>"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = [
    "dysleksi/dysleksi/static/vendor/scss/**",
    "dysleksi/dysleksi/static/vendor/js/bootstrap/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2011-2021 The Bootstrap Authors (https://github.com/twbs/bootstrap/graphs/contributors)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "dysleksi/dysleksi/static/vendor/js/chartjs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "(c) 2025 Chart.js Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "dysleksi/dysleksi/static/fonts/Karinika-Regular.ttf**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2026 Magenta ApS and SIL Global"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "dysleksi/dysleksi/static/fonts/phosphor/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2020 Phosphor Icons"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "dysleksi/dysleksi/static/fonts/andika/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2004-2022 SIL International  (http://www.sil.org/)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "dysleksi/dysleksi/static/vendor/fonts/dmsans/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2014 The DM Sans Project Authors (https://github.com/googlefonts/dm-fonts)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "dysleksi/dysleksi/static/vendor/js/peerjs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2015 Michelle Bu and Eric Zhang, http://peerjs.com"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "dysleksi/dysleksi/static/vendor/js/popper/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2015 gatsbyjs"
SPDX-License-Identifier = "MIT"
