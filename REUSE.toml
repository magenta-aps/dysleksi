version = 1
SPDX-PackageName = "Dysleksi"
SPDX-PackageSupplier = "Magenta ApS <info@magenta.dk>"

[[annotations]]
path = [
    "dysleksi/**",
    "dev-environment/**",
    "docker/**",
    "docker-compose.yml",
    "docker-compose.override.template.yml",
    ".eslint/**",
    ".coveragerc",
    ".gitlab-ci.yml",
    "mypy.ini",
    "requirements.txt",
    ".coveragerc",
    "REUSE.toml",
    "README.md",
    ".renovaterc",
    "dev-idp/**",
    "rfc/**",
    "file-data/**",
    "instructions/**",
    "js_coverage/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Magenta ApS <info@magenta.dk>"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = [
    "dysleksi/dysleksi/static/vendor/scss/**",
    "dysleksi/dysleksi/static/vendor/js/bootstrap/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2011-2021 The Bootstrap Authors (https://github.com/twbs/bootstrap/graphs/contributors)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "dysleksi/dysleksi/static/fonts/Karinika-Regular.otf**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2026 Magenta ApS and SIL Global"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "dysleksi/dysleksi/static/vendor/fonts/figtree/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2022 The Figtree Project Authors (https://github.com/erikdkennedy/figtree)"
SPDX-License-Identifier = "OFL-1.1"
